name: Auto Merge Jules PRs

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Jules PR
    if: >
      contains(github.event.pull_request.body, 'jules.google.com') ||
      contains(github.event.pull_request.body, 'Jules') ||
      contains(github.event.pull_request.user.login, 'jules')
    runs-on: ubuntu-latest
    steps:
      - name: Automatically Squash and Merge Jules PR
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
